name: Deploy dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *' # ежечасно подтягивать свежие данные из Content OS
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_CONTENT_OS: ${{ secrets.CONTENT_OS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Свежий снимок из приватного Content OS (только разрешённые поля, см. scripts/export.mjs).
      # Без секрета CONTENT_OS_TOKEN используется закоммиченный data.json.
      - if: env.HAS_CONTENT_OS == 'true'
        uses: actions/checkout@v4
        with:
          repository: shoraLBRT/Fabrika-Zvezd
          token: ${{ secrets.CONTENT_OS_TOKEN }}
          path: content-os
      - if: env.HAS_CONTENT_OS == 'true'
        run: node scripts/export.mjs content-os data.json && rm -rf content-os
      - run: |
          mkdir -p site
          cp index.html style.css app.js logic.js data.json favicon.svg apple-touch-icon.png site/
          # Версия в ссылках на файлы, чтобы браузер не показывал старую версию из кэша.
          v=${GITHUB_SHA::8}
          sed -i "s/style\.css\"/style.css?v=$v\"/; s/app\.js\"/app.js?v=$v\"/" site/index.html
          sed -i "s#'./logic\.js'#'./logic.js?v=$v'#" site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
